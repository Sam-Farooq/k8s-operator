---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: postgresbackups.ops.sam-farooq.dev
spec:
  group: ops.sam-farooq.dev
  names:
    categories:
    - ops
    kind: PostgresBackup
    listKind: PostgresBackupList
    plural: postgresbackups
    shortNames:
    - pgbackup
    - pgb
    singular: postgresbackup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastSuccessfulTime
      name: Last Success
      type: date
    - jsonPath: .status.nextScheduleTime
      name: Next
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PostgresBackup is a scheduled logical backup of one Postgres
          database.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PostgresBackupSpec is the desired state of a PostgresBackup.
            properties:
              activeDeadlineSeconds:
                default: 3600
                description: |-
                  ActiveDeadlineSeconds is passed to the Job. A dump that hangs on a lock
                  has to fail rather than hold the slot forever.
                format: int64
                maximum: 86400
                minimum: 60
                type: integer
              backoffLimit:
                default: 2
                description: BackoffLimit is passed to the Job.
                format: int32
                maximum: 10
                minimum: 0
                type: integer
              cleanupTimeoutSeconds:
                default: 900
                description: |-
                  CleanupTimeoutSeconds bounds how long deletion waits for owned Jobs to
                  go away before the finalizer is removed regardless. Past it the object
                  is deleted and the Jobs are reported as abandoned rather than the
                  object being stuck forever.
                format: int64
                maximum: 3600
                minimum: 0
                type: integer
              concurrencyPolicy:
                default: Forbid
                description: |-
                  ConcurrencyPolicy decides what a slot does when a Job is already
                  running.
                enum:
                - Allow
                - Forbid
                type: string
              destination:
                description: Destination is where the dump goes.
                properties:
                  claimName:
                    description: |-
                      ClaimName is a PersistentVolumeClaim in this namespace. The operator
                      never mounts it and never reads it.
                    minLength: 1
                    type: string
                  prefix:
                    description: |-
                      Prefix starts every dump file name, so one claim can hold the backups
                      of several databases. It is also what the in-Job prune matches on,
                      which is why it is restricted to the characters a glob treats as
                      literal.
                    maxLength: 40
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  subPath:
                    description: SubPath is a directory inside the claim, created
                      by the Job if absent.
                    maxLength: 120
                    pattern: ^[a-z0-9]([-/a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - claimName
                - prefix
                type: object
              image:
                description: |-
                  Image must contain pg_dump and a shell. Its major version has to be at
                  or above the server's, because pg_dump refuses a newer server and
                  nothing in this operator can tell you that before the first run fails.
                minLength: 1
                type: string
              resources:
                description: |-
                  Resources is the dump container's requests and limits. A Job with no
                  memory limit on a shared node is how a backup takes down the thing it
                  is backing up.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This is an alpha field and requires enabling the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              retention:
                description: Retention decides what is deleted and when.
                properties:
                  keepFailed:
                    default: 3
                    description: |-
                      KeepFailed is how many failed Jobs are kept for their logs. Set it to
                      zero and a failure is gone before anyone reads it.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  keepSucceeded:
                    default: 7
                    description: |-
                      KeepSucceeded is how many successful runs keep their Job object and
                      their entry in status.history. It is also the file count the in-Job
                      prune keeps.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  pruneFiles:
                    default: true
                    description: |-
                      PruneFiles lets the Job delete older dump files in its own prefix after
                      a successful dump.

                      It is a pointer because its default is true. A plain bool with
                      omitempty marshals false as absent, the API server then applies the
                      default, and pruneFiles: false silently becomes true.
                    type: boolean
                type: object
              schedule:
                description: |-
                  Schedule is a five field cron expression evaluated in UTC. Names and
                  @daily style macros are rejected.
                maxLength: 200
                minLength: 9
                type: string
              serviceAccountName:
                description: ServiceAccountName is the account the Job's pod runs
                  as.
                type: string
              source:
                description: Source is the database to dump.
                properties:
                  database:
                    description: Database is the database name passed to pg_dump.
                    minLength: 1
                    type: string
                  host:
                    description: Host is the Postgres host, usually a Service name.
                    minLength: 1
                    type: string
                  passwordKey:
                    default: password
                    description: PasswordKey is the key in that Secret holding the
                      password.
                    minLength: 1
                    type: string
                  port:
                    default: 5432
                    description: Port is the Postgres port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  secretName:
                    description: SecretName is a Secret in this namespace holding
                      the credentials.
                    minLength: 1
                    type: string
                  sslMode:
                    default: require
                    description: |-
                      SSLMode is passed through to libpq as PGSSLMODE. The default is
                      require, not disable, because a backup is the whole database crossing
                      the network.
                    enum:
                    - disable
                    - allow
                    - prefer
                    - require
                    - verify-ca
                    - verify-full
                    type: string
                  usernameKey:
                    default: username
                    description: UsernameKey is the key in that Secret holding the
                      role name.
                    minLength: 1
                    type: string
                required:
                - database
                - host
                - secretName
                type: object
              startingDeadlineSeconds:
                default: 600
                description: |-
                  StartingDeadlineSeconds is how late a slot may be started. A slot older
                  than this is counted in status.skippedSlots and never run, which is
                  what stops a restart after a long outage from creating a Job for every
                  slot it missed.
                format: int64
                maximum: 86400
                minimum: 60
                type: integer
              suspend:
                default: false
                description: |-
                  Suspend stops new Jobs being created. A Job already running is left to
                  finish, because killing a dump halfway is the thing this operator will
                  not do.
                type: boolean
            required:
            - destination
            - image
            - schedule
            - source
            type: object
          status:
            description: PostgresBackupStatus is the observed state of a PostgresBackup.
            properties:
              activeJobs:
                description: ActiveJobs are the owned Jobs that have not finished.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: |-
                  Conditions follow the Kubernetes convention: Ready, Running and
                  Degraded, each carrying the generation it was set from.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              history:
                description: History is one record per owned Job, newest slot first.
                items:
                  description: |-
                    RunRecord is one slot's outcome. Every field is read back off the Job on
                    each reconcile rather than written once, so deleting a Job by hand removes
                    its record and nothing goes out of step.
                  properties:
                    completionTime:
                      description: |-
                        CompletionTime is the Job's own completion time, absent while running
                        and absent on failure, because a failed Job has no completion time.
                      format: date-time
                      type: string
                    jobName:
                      description: JobName is the Job this record was read from.
                      type: string
                    phase:
                      description: Phase is where the run ended up.
                      enum:
                      - Running
                      - Succeeded
                      - Failed
                      type: string
                    reason:
                      description: Reason is the failed Job condition's reason, when
                        there is one.
                      type: string
                    slot:
                      description: |-
                        Slot is the scheduled time the Job was created for, which is also what
                        its name is derived from.
                      format: date-time
                      type: string
                    startTime:
                      description: StartTime is the Job's own start time.
                      format: date-time
                      type: string
                  required:
                  - jobName
                  - phase
                  - slot
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              lastScheduleTime:
                description: |-
                  LastScheduleTime is the most recent slot the controller has acted on,
                  whether that action was creating a Job or deciding the slot was too
                  late to run.
                format: date-time
                type: string
              lastSuccessfulTime:
                description: |-
                  LastSuccessfulTime is the completion time of the newest Job that
                  succeeded and is still present. It goes backwards when retention
                  deletes that Job, which is correct: the field describes what can still
                  be inspected.
                format: date-time
                type: string
              nextScheduleTime:
                description: |-
                  NextScheduleTime is when the next slot falls, recomputed every
                  reconcile.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation this status was computed
                  from. A status whose observedGeneration is behind metadata.generation
                  describes an older spec and should not be trusted.
                format: int64
                type: integer
              skippedSlots:
                description: |-
                  SkippedSlots counts slots that were past the starting deadline by the
                  time the controller looked. It only ever increases.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
