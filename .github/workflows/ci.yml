name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ENVTEST_K8S_VERSION: "1.32.0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.3.0
        with:
          # The toolchain comes from go.mod so there is one place to change it.
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.14.0

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.3.0
        with:
          go-version-file: go.mod
          cache: true
      # Regenerates the CRD, the RBAC role and the deepcopy functions and
      # fails if the committed files move. A CRD edited by hand and a CRD
      # generated from the types are indistinguishable until the day they
      # disagree.
      - run: make verify-manifests

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      # envtest runs a real kube-apiserver and etcd out of ./bin/k8s. The
      # download is the only thing in this job that touches the network, so
      # it is cached on the version alone.
      - uses: actions/cache@v4.2.3
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-${{ env.ENVTEST_K8S_VERSION }}

      - name: fetch the control plane binaries
        run: make envtest ENVTEST_K8S_VERSION=${{ env.ENVTEST_K8S_VERSION }}

      - name: build the manager
        run: make build

      - name: test under the race detector
        run: make test-race ENVTEST_K8S_VERSION=${{ env.ENVTEST_K8S_VERSION }}
